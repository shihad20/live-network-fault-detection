frr defaults traditional
hostname r2
log stdout

interface eth1
 ip address 10.0.12.2/24
!
interface eth2
 ip address 10.0.24.2/24
!
interface lo
 ip address 2.2.2.2/32
!
router ospf
 ospf router-id 2.2.2.2
 network 10.0.12.0/24 area 0
 network 10.0.24.0/24 area 0
 network 2.2.2.2/32 area 0
!
line vty
