frr defaults traditional
hostname r3
log stdout

interface eth1
 ip address 10.0.13.3/24
!
interface eth2
 ip address 10.0.34.3/24
!
interface lo
 ip address 3.3.3.3/32
!
router ospf
 ospf router-id 3.3.3.3
 network 10.0.13.0/24 area 0
 network 10.0.34.0/24 area 0
 network 3.3.3.3/32 area 0
!
line vty
